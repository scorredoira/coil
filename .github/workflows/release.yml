name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: 'Optional successful build run to verify and publish without rebuilding'
        required: false
        type: string
      release_tag:
        description: 'Existing tag for the reused artifacts'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.artifacts_run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: aarch64-linux
            os: ubuntu-22.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - platform: aarch64-macos
            os: macos-14
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.container }}
      - name: Link grammar C++ support statically on Linux
        if: runner.os == 'Linux'
        run: echo 'CXXFLAGS=-static-libstdc++ -static-libgcc' >> "$GITHUB_ENV"
      - name: Build binary and all grammars
        run: cargo build --release --locked -p helix-term --bin sid
      - name: Test
        env:
          HELIX_DISABLE_AUTO_GRAMMAR_BUILD: '1'
        run: cargo test --locked -p helix-term -p helix-view --lib
      - name: Check Linux binary and grammar compatibility
        if: runner.os == 'Linux'
        run: python3 fork/release/check-linux-abi.py target/release/sid runtime/grammars
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="$RELEASE_TAG"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version=v0.0.0; fi
          bash fork/release/package.sh "$PLATFORM" "$version"
      - name: Smoke test extracted archive
        shell: bash
        run: |
          smoke=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$smoke"
          app=$(find "$smoke" -name sid -type f)
          "$app" --version
          "$app" --health rust
          SID_PREFIX="$smoke/install" sh "$(dirname "$app")/install.sh"
          "$smoke/install/bin/sid" --version
          if [[ "$RUNNER_OS" == Linux ]]; then
            XDG_CACHE_HOME="$smoke/cache" dist/*.run --version
            XDG_CACHE_HOME="$smoke/cache" dist/*.run --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sid-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  linux-compatibility:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.artifacts_run_id != '')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            os: ubuntu-22.04
          - platform: aarch64-linux
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sid-${{ matrix.platform }}
          path: dist
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install and launch on Ubuntu 20.04 (glibc 2.31)
        run: |
          mkdir extracted
          tar -xzf dist/*.tar.gz -C extracted
          docker run --rm -v "$PWD:/work:ro" ubuntu:20.04 sh -eu -c '
            getconf GNU_LIBC_VERSION
            SID_PREFIX=/tmp/installed sh /work/extracted/*/install.sh
            /tmp/installed/bin/sid --version
            /tmp/installed/bin/sid --health rust > /tmp/health
            cat /tmp/health
            grep -q "Tree-sitter parser:.*✓" /tmp/health
            sh /work/dist/*.run --version
          '

  publish:
    if: ${{ always() && needs.linux-compatibility.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
    needs: [build, linux-compatibility]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sid-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id || github.run_id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(gh run view "$ARTIFACTS_RUN_ID" --json headSha --jq .headSha)"
          cd dist
          sha256sum *.tar.gz *.run > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "sid $RELEASE_TAG" \
            --notes-file ../fork/release/README.md --draft ./*
          gh release edit "$RELEASE_TAG" --draft=false --latest
