name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            os: ubuntu-22.04
          - platform: aarch64-linux
            os: ubuntu-22.04-arm
          - platform: x86_64-macos
            os: macos-15-intel
          - platform: aarch64-macos
            os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Build binary and all grammars
        run: cargo build --release --locked -p helix-term --bin coil
      - name: Test
        env:
          HELIX_DISABLE_AUTO_GRAMMAR_BUILD: '1'
        run: cargo test --locked -p helix-term -p helix-view --lib
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="$RELEASE_TAG"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version=v0.0.0; fi
          bash fork/release/package.sh "$PLATFORM" "$version"
      - name: Smoke test extracted archive
        shell: bash
        run: |
          smoke=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$smoke"
          app=$(find "$smoke" -name coil -type f)
          "$app" --version
          "$app" --health rust
          COIL_PREFIX="$smoke/install" sh "$(dirname "$app")/install.sh"
          "$smoke/install/bin/coil" --version
          if [[ "$RUNNER_OS" == Linux ]]; then
            XDG_CACHE_HOME="$smoke/cache" dist/*.run --version
            XDG_CACHE_HOME="$smoke/cache" dist/*.run --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coil-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coil-*
          merge-multiple: true
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz *.run > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "Coil $RELEASE_TAG" \
            --notes-file ../fork/release/README.md --draft ./*
          gh release edit "$RELEASE_TAG" --draft=false --latest
