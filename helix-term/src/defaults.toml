# Coil's defaults: the editor as it should be the moment it is installed.
# The user's config.toml is laid over this, so any of it can still be changed.
# No arrays here: the merge would append the user's items to them, not replace.

theme = { light = "github_light", dark = "github_dark" }

[editor]
bufferline = "multiple"
color-modes = true

[editor.file-picker]
git-ignore = false

[editor.auto-save]
focus-lost = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true

[editor.word-completion]
enable = false

[keys.normal]
C-c = "yank_to_clipboard"
backspace = "delete_selection_or_previous_char"
del = "delete_selection_noyank"
C-a = "select_all"
Cmd-c = "yank_to_clipboard"
C-s = ":write"
Cmd-s = ":write"
C-g = "goto_line_prompt"
C-f = "search_in_file"
A-z = ":toggle soft-wrap.enable"
C-M = "markdown_preview_toggle"
C-q = ":quit-all"
F2 = "rename_symbol"
F8 = "goto_next_diag"
F12 = "goto_definition"
S-F12 = "goto_reference"

[keys.normal.space]
space = "global_search"

[keys.select]
C-c = "yank_to_clipboard"
backspace = "delete_selection_or_previous_char"
del = "delete_selection_noyank"
C-a = "select_all"
Cmd-c = "yank_to_clipboard"
C-s = ":write"
Cmd-s = ":write"
C-g = "goto_line_prompt"
C-f = "search_in_file"
A-z = ":toggle soft-wrap.enable"
C-M = "markdown_preview_toggle"

[keys.insert]
Cmd-c = "yank_to_clipboard"
C-a = "select_all"
S-left = "extend_char_left"
S-right = "extend_char_right"
S-up = "extend_visual_line_up"
S-down = "extend_visual_line_down"
S-home = "extend_to_line_start"
S-end = "extend_to_line_end"
C-S-left = "extend_prev_word_start"
C-S-right = "extend_next_word_end"
C-s = ":write"
Cmd-s = ":write"
C-g = "goto_line_prompt"
C-f = "search_in_file"
A-z = ":toggle soft-wrap.enable"
C-M = "markdown_preview_toggle"
